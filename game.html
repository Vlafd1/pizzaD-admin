<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Піца — кінематографічний тренажер</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
/* ==== PIZZA_CONFIG: shared registry (identical copy in simulator.html and admin.html). Add a new ingredient as ONE object in PC.ingredients and keep both files in sync. ==== */
/* shared registry + versioned state helpers (inlined in index.html; no separate file) */
(function (root) {
  'use strict';
  const PC = { schema: 2, version: '2026.11.12' };

  /* ---- categories: phase = before (pre) or after (post) the oven ---- */
  PC.categories = [
    { id: 'meat',  n: "М'ясо",             phase: 'pre'  },
    { id: 'che',   n: 'Сири',              phase: 'pre'  },
    { id: 'veg',   n: 'Овочі',             phase: 'pre'  },
    { id: 'gr',    n: 'Спеції та зелень',  phase: 'post' },
    { id: 'sauce', n: 'Соуси-топінги',     phase: 'post' }
  ];

  /* ---- ingredients. pre-oven: pp = pieces per 10 g, ts = piece size. post-oven greens: g = default grams, pp, ts.
         topping sauces: g = default grams, c / c2 = line colours, conc:true = accent sauce ---- */
  PC.ingredients = [
    { id: 'pep', n: 'Пепероні', cat: 'meat', icon: '🍕', pp: 4, ts: .85 },
    { id: 'sal', n: 'Салями', cat: 'meat', icon: '🥩', pp: 4, ts: .85 },
    { id: 'shy', n: 'Шинка', cat: 'meat', icon: '🍖', pp: 3, ts: .7 },
    { id: 'bac', n: 'Бекон', cat: 'meat', icon: '🥓', pp: 4, ts: .62 },
    { id: 'bal', n: 'Балик', cat: 'meat', icon: '🥩', pp: 3, ts: .64 },
    { id: 'hun', n: 'Мисливські ковбаски', cat: 'meat', icon: '🌭', pp: 4, ts: .7 },
    { id: 'chk', n: 'Копчене куряче філе', cat: 'meat', icon: '🍗', pp: 8, ts: 1.3 },
    { id: 'chi', n: 'Перець чілі', cat: 'veg', icon: '🌶️', pp: 14, ts: 1.1 },
    { id: 'cor', n: 'Кукурудза', cat: 'veg', icon: '🌽', pp: 28, ts: 1.7 },
    { id: 'oni', n: 'Маринована цибуля', cat: 'veg', icon: '🧅', pp: 6, ts: 1.1 },
    { id: 'pin', n: 'Ананас', cat: 'veg', icon: '🍍', pp: 5, ts: 1.1 },
    { id: 'cuc', n: 'Мариновані огірки', cat: 'veg', icon: '🥒', pp: 6, ts: .85 },
    { id: 'tom', n: 'Помідор', cat: 'veg', icon: '🍅', pp: 10, ts: 1.1 },
    { id: 'bel', n: 'Болгарський перець', cat: 'veg', icon: '🫑', pp: 10, ts: 1.1 },
    { id: 'oli', n: 'Оливки', cat: 'veg', icon: '🫒', pp: 20, ts: 1.2 },
    { id: 'mas', n: 'Маслини', cat: 'veg', icon: '🫒', pp: 20, ts: 1.2 },
    { id: 'mus', n: 'Гриби печериці', cat: 'veg', icon: '🍄', pp: 37.4, ts: .7 },
    { id: 'moz', n: 'Моцарела', cat: 'che', icon: '🧀', pp: 43.2, ts: 2.1 },
    { id: 'ched', n: 'Чеддер', cat: 'che', icon: '🧀', pp: .8, ts: .28 },
    { id: 'blu', n: 'Сир з блакитною пліснявою', cat: 'che', icon: '🧀', pp: 8, ts: 1.2 },
    { id: 'mix', n: 'Мікс сирів', cat: 'che', icon: '🧀', pp: 60, ts: 1.5 },
    { id: 'aru', n: 'Рукола', cat: 'gr', icon: '🥬', g: 20, pp: 14, ts: 1.2 },
    { id: 'gon', n: 'Зелена цибуля', cat: 'gr', icon: '🌱', g: 5, pp: 34, ts: 2.1 },
    { id: 'spi', n: 'Італійські спеції', cat: 'gr', icon: '🌿', g: 1, pp: 44, ts: 3 },
    { id: 'ice', n: 'Айсберг', cat: 'gr', icon: '🥬', g: 20, pp: 12, ts: 1.2 },
    { id: 'ter', n: 'Теріякі', cat: 'sauce', icon: '🥫', g: 40, c: '#4a2410', c2: '#a2602c' },
    { id: 'sch', n: 'Світ чилі', cat: 'sauce', icon: '🥫', g: 40, c: '#d9381e', c2: '#ff8a5e' },
    { id: 'cez', n: 'Цезаріо', cat: 'sauce', icon: '🥫', g: 40, c: '#efe1bd', c2: '#fffaea' },
    { id: 'bur', n: 'Соус Бургер', cat: 'sauce', icon: '🥫', g: 40, c: '#c4683a', c2: '#efa76c' }
  ];

  /* ---- base sauces ---- */
  PC.baseSauces = {
    tomato: { n: 'Томатний соус', g: 60, c: '#c8321e', icon: '🍅' },
    cream:  { n: 'Вершковий соус', g: 40, c: '#f6f8fb', icon: '🥛' },
    bbq:    { n: 'Соус BBQ', g: 60, c: '#6b2a14', icon: '🔥' }
  };

  /* ---- dough sizes / formats. cm 101 / 102 / 103 are format ids, not centimetres ---- */
  PC.sizes = {
    S: { g: 200, cm: 25 }, M: { g: 250, cm: 30 }, L: { g: 400, cm: 35 },
    K: { g: 125, cm: 101, ns: 1, n: 'К-Піца' },
    C: { g: 120, cm: 102, ns: 1, n: 'Піца Капкейки' },
    W: { g: 200, cm: 103, gm: 25, ns: 1, n: 'Піца-сендвіч' }
  };
  PC.formats = {   /* admin sections: key -> format id in TECH_NS + display data */
    std:      { title: 'Стандартні піци', icon: '🍕', cms: [25, 30, 35], ac: '#f97316', rgb: '249,115,22' },
    cupcakes: { title: 'Піца-капкейки',   icon: '🧁', cms: [102], fid: 102, ac: '#ec4899', rgb: '236,72,153', noSauceToppings: true },
    sandwich: { title: 'Піца-сендвічі',   icon: '🥪', cms: [103], fid: 103, ac: '#eab308', rgb: '234,179,8' },
    k_pizza:  { title: 'К-піца',          icon: '🥙', cms: [101], fid: 101, ac: '#06b6d4', rgb: '6,182,212' }
  };
  PC.sizeKey = { 25: 'S', 30: 'M', 35: 'L', 101: 'K', 102: 'C', 103: 'W' };

  /* ---- start-weight rules (grams of the FIRST click of an ingredient) ---- */
  PC.startRules = {
    DEF_G: { pep: 60, hun: 30, shy: 30, bac: 30, bal: 50, chk: 30, blu: 30, chi: 5, oni: 30, pin: 30, oli: 10, mas: 10 },
    FINE: ['chi', 'oli', 'mas'],              /* micro-dosed: never shifted by crust size */
    SIZE_D: { 25: -10, 30: 0, 35: 20 }        /* round pizzas: shift by crust size */
  };

  /* ---- helpers ---- */
  const byId = {}; PC.ingredients.forEach(i => { byId[i.id] = i; });
  PC.rebuildIndex = () => { Object.keys(byId).forEach(k => delete byId[k]); PC.ingredients.forEach(i => { byId[i.id] = i; }); };
  PC.ing = id => byId[id] || null;
  PC.cat = id => PC.categories.find(c => c.id === id) || null;
  PC.catOf = id => (byId[id] ? byId[id].cat : null);
  PC.ids = (cat) => PC.ingredients.filter(i => i.cat === cat).map(i => i.id);
  PC.byPhase = phase => PC.ingredients.filter(i => (PC.cat(i.cat) || {}).phase === phase);
  PC.catalog = phase => PC.categories.filter(c => c.phase === phase).map(c => ({ id: c.id, cat: c.n, items: PC.ingredients.filter(i => i.cat === c.id).map(i => ({ id: i.id, name: i.n })) }));
  PC.isBaseSauce = id => Object.prototype.hasOwnProperty.call(PC.baseSauces, id);
  PC.nameOf = id => PC.isBaseSauce(id) ? PC.baseSauces[id].n : (byId[id] ? byId[id].n : id);
  PC.iconOf = id => PC.isBaseSauce(id) ? PC.baseSauces[id].icon : (byId[id] && byId[id].icon) || '•';

  /* default start weight for an ingredient / base sauce in a format (cm 25 / 30 / 35 or format id 101 / 102 / 103) */
  PC.startDefault = function (cm, id) {
    cm = Number(cm);
    if (PC.isBaseSauce(id)) return cm > 100 ? (id === 'cream' ? 40 : 60) : (id === 'cream' ? (cm === 35 ? 80 : 40) : (cm === 35 ? 120 : 60));
    const it = byId[id], cat = it ? it.cat : null;
    if (it && (cat === 'gr' || cat === 'sauce')) return it.conc ? 20 : (it.g || 1);
    if (cm > 100) {
      if (id === 'ched') return 25;
      if (id === 'chi' && (cm === 101 || cm === 103)) return 5;
      if (cm === 103 && (id === 'oli' || id === 'mas')) return 10;
      return 20;
    }
    const step = id === 'ched' ? 12.5 : (cat === 'meat' ? 5 : 10);
    const R = PC.startRules, b = R.DEF_G[id] !== undefined ? R.DEF_G[id] : (cat === 'che' ? 50 : 30);
    return R.FINE.includes(id) || id === 'ched' ? b : Math.max(step, b + (R.SIZE_D[cm] || 0));
  };
  /* effective weight = user override (if any, and the ingredient still exists) else the default from the registry */
  PC.startW = function (overrides, cm, id) {
    const v = overrides && overrides[cm] && overrides[cm][id];
    return v > 0 ? Number(v) : PC.startDefault(cm, id);
  };
  PC.doughDefault = cm => (PC.sizes[PC.sizeKey[cm]] || {}).g;
  /* drop overrides of ingredients that were removed from the registry and junk values; new ingredients simply have no override -> default */
  PC.sanitizeStart = function (w) {
    const out = {};
    Object.entries(w || {}).forEach(([cm, o]) => {
      if (!PC.sizeKey[cm] || !o || typeof o !== 'object') return;
      Object.entries(o).forEach(([id, g]) => { if ((byId[id] || PC.isBaseSauce(id)) && Number(g) > 0) (out[cm] = out[cm] || {})[id] = Number(g); });
    });
    return out;
  };
  PC.sanitizeDough = function (d) {
    const out = {};
    Object.entries(d || {}).forEach(([cm, g]) => { if (PC.sizeKey[cm] && Number(g) > 0 && Number(g) !== PC.doughDefault(cm)) out[cm] = Number(g); });
    return out;
  };
  /* admin stores non-standard cards per format {fmt:{name:tk}}; the simulator wants {name:{formatId:tk}} */
  PC.nsToByName = function (ns) {
    const out = {};
    Object.entries(PC.formats).forEach(([fmt, f]) => {
      if (!f.fid) return;
      Object.entries((ns && ns[fmt]) || {}).forEach(([name, tk]) => { (out[name] = out[name] || {})[f.fid] = tk; });
    });
    return out;
  };

  /* ================= shared persistent state (versioned, merged with the registry on every read) =================
     { schema, rev, registryVersion, std:{name:{25,30,35}}, ns:{fmt:{name:tk}}, created:{key:ts}, start:{w:{cm:{id:g}}, dough:{cm:g}} } */
  const KEY = 'pizzaStudio.config', LEGACY = ['pizza_simulator_recipes', 'pizza_simulator_recipes_ns', 'pizza_admin_created', 'pizza_admin_start'];
  const store = { get(k) { try { return root.localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { root.localStorage.setItem(k, v); return true; } catch (e) { return false; } } };

  PC.loadState = function () {
    let o = null;
    try { o = JSON.parse(store.get(KEY) || 'null'); } catch (e) { o = null; }
    if (!o || typeof o !== 'object') o = PC.migrateLegacy();
    if (!o) return null;
    /* forward-compatible merge: anything missing in an older cache is filled from defaults, junk is dropped */
    const st = { schema: PC.schema, fromSchema: Number(o.schema) || 1, rev: Number(o.rev) || 0, registryVersion: o.registryVersion || null,
      std: o.std && typeof o.std === 'object' ? o.std : null, ns: o.ns && typeof o.ns === 'object' ? o.ns : null,
      created: o.created && typeof o.created === 'object' ? o.created : {},
      start: { w: PC.sanitizeStart(o.start && o.start.w), dough: PC.sanitizeDough(o.start && o.start.dough) } };
    return st;
  };
  PC.migrateLegacy = function () {
    const j = k => { try { return JSON.parse(store.get(k) || 'null'); } catch (e) { return null; } };
    const std = j(LEGACY[0]), ns = j(LEGACY[1]), cr = j(LEGACY[2]), st = j(LEGACY[3]);
    if (!std && !ns && !cr && !st) return null;
    return { schema: 1, rev: 0, std, ns, created: cr || {}, start: { w: (st && st.w) || {}, dough: (st && st.dough) || {} } };
  };
  PC.saveState = function (state) {
    const o = { schema: PC.schema, rev: Date.now(), registryVersion: PC.version, std: state.std, ns: state.ns, created: state.created || {},
      start: { w: PC.sanitizeStart(state.start && state.start.w), dough: PC.sanitizeDough(state.start && state.start.dough) } };
    const ok = store.set(KEY, JSON.stringify(o));
    PC._lastRev = o.rev;
    try { if (PC._bc) PC._bc.postMessage({ type: 'config', rev: o.rev }); } catch (e) {}
    try { root.dispatchEvent(new CustomEvent('pizza-config-changed', { detail: { rev: o.rev } })); } catch (e) {}
    return ok ? o : null;
  };
  /* fn(state) fires when ANOTHER tab / window (storage event, BroadcastChannel) or this window (custom event) saves */
  PC.subscribe = function (fn) {
    let last = (PC.loadState() || {}).rev || 0, t = null;
    const fire = () => { clearTimeout(t); t = setTimeout(() => { const st = PC.loadState(); if (st && st.rev !== last) { last = st.rev; if (st.rev !== PC._lastRev) fn(st); }   /* own saves are not echoed back */ }, 30); };
    root.addEventListener('storage', e => { if (e.key === KEY || e.key === null) fire(); });
    root.addEventListener('pizza-config-changed', fire);
    try { if (!PC._bc && root.BroadcastChannel) PC._bc = new root.BroadcastChannel('pizza-studio'); if (PC._bc) PC._bc.addEventListener('message', fire); } catch (e) {}
    return () => {};
  };
  try { if (root.BroadcastChannel) PC._bc = new root.BroadcastChannel('pizza-studio'); } catch (e) {}
  PC.KEY = KEY;

  root.PIZZA_CONFIG = PC;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  const g=AC.createGain(),lp=AC.createBiquadFilter();g.gain.value=.5;lp.type='lowpass';lp.frequency.value=3000;lp.Q.value=.4;   /* master low-pass: takes the edge off every sound */
  g.connect(lp);lp.connect(AC.destination);AC.master=g;
  const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,AC.sampleRate);s.connect(AC.destination);s.start()}      /* warm-up so the very first sound has no lag */
 catch(e){AC=null}
};
function tone(f,at,dur,vol,type='sine',f2,atk=.012){
 if(!AC||SFX_MUTED)return;const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);f2&&o.frequency.exponentialRampToValueAtTime(f2,t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(AC.master);o.start(t);o.stop(t+dur+.02);
}
function noise(at,dur,vol,f1,f2,q=1.2,atk=.012){                         /* band-passed noise burst, centre frequency sweeps f1 -> f2 */
 if(!AC||SFX_MUTED)return;const t=AC.currentTime+at;
 if(!AC.nb){const n=AC.sampleRate*.8|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AC.nb=b}
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=AC.nb;f.type='bandpass';f.Q.value=q;
 f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(AC.master);s.start(t,Math.random()*.3);s.stop(t+dur+.02);
}
/* core events (smooth sine chimes, lower register, slower attack, no bright overtones) */
const sfxOrder=()=>{tone(523,0,.8,.085,'sine',null,.02);tone(262,0,.8,.04,'sine',null,.02);tone(659,.14,1,.085,'sine',null,.02)};
const sfxDone=()=>{[392,494,587].forEach((f,i)=>tone(f,i*.11,.6,.08,'sine',null,.02));tone(784,.33,1.1,.085,'sine',null,.02);tone(392,.33,1.1,.04,'sine',null,.02)};

function playFlameSound(){                                               /* soft cozy flame: low swell + warm hiss + a few tiny crackles */
 noise(0,.75,.045,300,180,.7,.18);noise(.05,.6,.02,900,500,.6,.2);
 for(let i=0;i<7;i++)noise(.04+Math.random()*.6,.025+Math.random()*.03,.016+Math.random()*.02,1100+Math.random()*1300,600,2.2,.004);

const sndBtn=$('#sndBtn'),sndIcon=()=>{sndBtn.textContent=SFX_MUTED?'🔇':'🔊'};sndIcon();
sndBtn.addEventListener('click',()=>{SFX_MUTED=!SFX_MUTED;try{localStorage.setItem('pzMute',SFX_MUTED?'1':'0')}catch(e){}sndIcon()});

/* ---- start screen / training flow ---- */
const ACTIVE_MODES=['pizza','focus','custom','all'];   /* 'focus' = targeted training on one chosen pizza */
const focusStore={get:()=>{try{return sessionStorage.getItem('pzFocus')}catch(e){return null}},set:n=>{try{n?sessionStorage.setItem('pzFocus',n):sessionStorage.removeItem('pzFocus')}catch(e){}}};
let FOCUS=null,PICK=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
 pizzaSizes=n=>Object.keys(TECH[n]||{}).map(Number).filter(cm=>Object.values(SIZES).some(s=>s.cm===cm)).sort((a,b)=>a-b);   /* sizes that have a tech card */
function openPick(){PICK=[...Object.keys(TECH).map(n=>({key:n,label:n,sub:pizzaSizes(n).join(' · ')+' см'})),...Object.entries(TECH_NS).flatMap(([n,z])=>Object.keys(z).filter(cm=>Object.values(SIZES).some(v=>v.ns&&v.cm===+cm)).map(cm=>({key:`ns|${cm}|${n}`,label:n,sub:szT(+cm)})))];$('#pickList').innerHTML=PICK.map((e,i)=>`<button type="button" data-i="${i}">${esc(e.label)}<small>${esc(e.sub)}</small></button>`).join('');$('#ssMenu').style.display='none';$('#pickPanel').classList.add('on')}
const closePick=()=>{$('#pickPanel').classList.remove('on');$('#ssMenu').style.display=''};
function startFocus(n){FOCUS=n;focusStore.set(n);closePick();startGame('focus')}
$('#ssPick').addEventListener('click',()=>RECIPES_READY.then(openPick));   /* catalog is read after recipes.json has been applied */
$('#pickBack').addEventListener('click',closePick);
$('#pickList').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)startFocus(PICK[+b.dataset.i].key)});   /* add ids here (and remove `disabled` on their buttons) to unlock a mode */
let currentGameMode=null;   /* 'pizza' | 'custom' | 'all' - pick per-mode catalogs inside genOrder() when they exist */
const modeStore={get:()=>{try{return sessionStorage.getItem('pzMode')}catch(e){return null}},set:m=>{try{m?sessionStorage.setItem('pzMode',m):sessionStorage.removeItem('pzMode')}catch(e){}}};
function restartSession(mode){                      /* fade out -> reset the whole session (reload) -> mode is restored on load */
 modeStore.set(mode);if(!mode)focusStore.set(null);document.body.style.transition='opacity .35s ease';document.body.style.opacity=0;
 setTimeout(()=>location.reload(),370);
}
const nextOrder=()=>restartSession(currentGameMode);   /* "Нове замовлення" after a finished pizza: same mode, new order modal */
const exitToMenu=()=>restartSession(null);              /* "В меню": back to the start screen */
function applyMode(m){if(m==='custom'||(m==='focus'&&nsFocus())){S.ns=true;S.size='K';S.panType=null;S.hasCheeseRim=false;refresh();panel()}}   /* «Нестандартні піци»: only TECH_NS orders, pan view from the first step */
function startGame(m){
 if(!ACTIVE_MODES.includes(m))return;
 if(currentGameMode){if(getComputedStyle($('#startScr')).display!=='none'&&!$('#startScr').classList.contains('out')){focusStore.set(null);restartSession(m)}return}   /* stale session mode + visible menu: restart cleanly in the clicked mode */
 currentGameMode=m;modeStore.set(m);applyMode(m);const sc=$('#startScr');sc.classList.add('out');
 setTimeout(()=>{sc.style.display='none';RECIPES_READY.then(showOrder)},520);
}
document.querySelectorAll('#startScr [data-mode]').forEach(b=>b.addEventListener('click',()=>startGame(b.dataset.mode)));
$('#exitBtn').addEventListener('click',exitToMenu);
refresh();panel();
if(ACTIVE_MODES.includes(modeStore.get())){currentGameMode=modeStore.get();FOCUS=focusStore.get();applyMode(currentGameMode);RECIPES_READY.then(showOrder)}   /* training continues in the selected mode: new order right after the reload */
