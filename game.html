<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Піца — кінематографічний тренажер</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--ink:#e8edf5;--mut:#8b96a8;--acc:#ff8a2a;--ok:#34c47c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;overflow:hidden;margin:0;background:#0b0f17;color:var(--ink);font-family:Manrope,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{background:radial-gradient(90% 55% at 15% 105%,rgba(255,120,30,.22),transparent 60%),radial-gradient(80% 50% at 95% -5%,rgba(70,110,220,.28),transparent 60%),linear-gradient(#0f1624,#0a0d14)}
#oven{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s;z-index:1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 2px,transparent 2px 26px),repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0 2px,transparent 2px 52px),radial-gradient(120% 70% at 50% 100%,#8a3208,#2a0f06 48%,#0a0807 85%)}
#oven .arch{position:absolute;left:6%;right:6%;top:12%;bottom:20%;border:10px solid #3b261a;border-radius:50% 50% 16px 16px/38% 38% 16px 16px;background:radial-gradient(#1c0b05,#050202);box-shadow:inset 0 0 70px #ff7a18aa,0 0 40px #ff6a0055}
.fl{position:absolute;bottom:17%;width:17%;height:32%;transform-origin:50% 100%;background:radial-gradient(ellipse at 50% 100%,#fff3a0 0,#ffb21f 24%,#ff5a0a 54%,transparent 72%);will-change:transform;animation:fl .7s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(.8,.75) skewX(-5deg)}to{transform:scale(1.1,1.2) skewX(6deg)}}
#stage{position:relative;z-index:12;isolation:isolate;\1}
#stage::before{content:'';position:absolute;left:6%;right:6%;top:12%;bottom:-3%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),rgba(0,0,0,0));z-index:-1;pointer-events:none;transform:scale(var(--k,1));transition:transform .55s}
#stage::after{content:'';position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,rgba(255,140,40,.5),rgba(255,140,40,0) 66%);z-index:-1;opacity:0;transition:opacity .5s;pointer-events:none}
#stage.hot::after{opacity:1}
#stage.lock{contain:layout size;flex:none}
.pwc{display:flex;align-items:center;gap:6px;flex:none;padding:3px 6px;border-radius:14px;background:rgba(255,255,255,.07);font-size:12px;white-space:nowrap}
.pwc b{min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.stp.sm{width:28px;height:28px;font-size:1.1rem;line-height:1}
#pzFx,#pzFx *{pointer-events:none}#pzFx{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;will-change:transform}#pz{will-change:transform}
#pz,#pz *,#pzBase,#pzBase *{pointer-events:none}#pz,#pzBase{width:100%;height:100%;display:block;overflow:visible}#pz{position:relative}#pzBase{position:absolute;inset:0}
#crust{fill:#e6c283;transition:fill 2.2s,transform .55s ease}#dough{fill:#f4dfb2;transition:fill 2.2s,transform .55s ease}#crust,#dough,#bakeR,#gSauce,#melt{transform-origin:160px 160px}
#bakeR,#melt{opacity:0;transition:opacity 2s,transform .55s ease}
#stage.baked #crust{fill:#d8a548}#stage.baked #dough{fill:#eac677}#stage.baked #bakeR{opacity:1}
#gIng{transition:filter 2.2s}#gSauce{transition:filter 2.2s,transform .55s ease}#gMold{opacity:0;transition:opacity 1.8s ease-in .4s}


.it{transition:transform .45s cubic-bezier(.25,1,.5,1),opacity .3s}
#sFill{opacity:0;transition:opacity .6s}
.fly{position:fixed;z-index:60;pointer-events:none;will-change:transform}
#spoon{position:fixed;width:120px;height:120px;opacity:0;z-index:70;pointer-events:none}
.tab{padding:6px 16px;border-radius:99px;background:rgba(255,255,255,.07);font-weight:700;font-size:.85rem}
.tab.on{background:var(--acc);color:#1a0f05}
.stp{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);font-size:1.4rem;font-weight:800}
.stp:active,.ing:active,.sauceb:active,.knifeb:active{transform:scale(.94)}
.bake,.ready{padding:0 18px;height:42px;border-radius:99px;background:linear-gradient(#ff9a3a,#ff6a1a);color:#1a0f05;font-weight:800;box-shadow:0 0 18px rgba(255,120,30,.5);white-space:nowrap}
.ready{background:linear-gradient(#45d68c,#22a869);box-shadow:0 0 18px rgba(52,196,124,.5);height:48px;padding:0 28px}
.ing{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;font-size:.62rem;line-height:1.1;text-align:center;color:var(--mut)}
.ing svg{border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.1)}.ing.on svg{box-shadow:0 0 0 3px var(--acc),0 0 14px rgba(255,138,42,.6)}.ing.on{color:var(--ink)}
.bdg{position:absolute;top:-2px;right:6px;background:var(--acc);color:#1a0f05;border-radius:99px;font-style:normal;font-weight:800;font-size:.62rem;padding:1px 6px}
.sauceb{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.8rem}
.knifeb{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:.8rem;padding:6px 8px;border-radius:16px;background:rgba(255,255,255,.06)}
.sz{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:.2s}
.sz b{font-size:1rem}.sz small{font-size:.58rem;color:var(--mut)}.sz.on{background:var(--acc);color:#1a0f05;box-shadow:0 0 16px rgba(255,138,42,.5)}.sz.on small{color:#4a2a0c}.sz:disabled{opacity:.4}
#hint{position:absolute;top:6px;left:50%;transform:translate(-50%,-10px);z-index:20;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.12);padding:7px 14px;border-radius:99px;font-size:.78rem;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:92%;text-align:center}
#hint.show{opacity:1;transform:translate(-50%,0)}#hint.bad{border-color:#ff5a4a;color:#ffb4aa}
/* core layout does not depend on the Tailwind CDN */
#app{position:relative;display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
#arena{position:relative;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#panel{position:relative;z-index:10;flex:none;height:232px;background:rgba(22,28,40,.92)!important}
#unit{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:8px}
.bx,.lid{position:absolute;inset:0;margin:auto;display:none;border-radius:10px}
.bx{z-index:3;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5))}
.bx i{position:absolute;inset:9%;background:#f4efe0;transform:rotate(5deg);box-shadow:0 2px 8px rgba(0,0,0,.25);background-image:linear-gradient(135deg,transparent 48%,rgba(0,0,0,.05) 50%,transparent 52%)}
.lid{z-index:14;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));align-items:center;justify-content:center;font-weight:800;letter-spacing:.2em;color:#6b4620;font-size:1.3rem;transform-origin:50% 0}
.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#done{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:rgba(6,9,14,.82);text-align:center}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;animation:spk 1.8s ease-out forwards}
@keyframes spk{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.undo{margin-top:6px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-weight:700;font-size:.78rem;color:var(--ink)}.undo:disabled{opacity:.35;cursor:default}.undo:not(:disabled):active{transform:scale(.95)}
header{position:relative;z-index:30}header #wn,header .tabular-nums{text-shadow:0 1px 8px rgba(0,0,0,.65)}
/* ---- sound toggle ---- */
#sizeCol{display:flex;flex-direction:column;align-items:stretch;gap:6px}
#sndBtn{height:30px;border-radius:12px;display:grid;place-items:center;font-size:.9rem;line-height:1;cursor:pointer;color:var(--mut,#94a3b8);background:rgba(255,255,255,.07);transition:.2s}
#sndBtn:hover{background:rgba(255,138,42,.18);color:#fff}
/* ---- exit to menu + page fade ---- */
body{animation:pgIn .4s ease both}@keyframes pgIn{from{opacity:0}to{opacity:1}}
#exitBtn{position:absolute;left:10px;top:8px;z-index:30;padding:6px 12px;border-radius:999px;font:inherit;font-size:.72rem;font-weight:700;letter-spacing:.04em;color:#cbd5e1;cursor:pointer;
 background:rgba(15,20,32,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);transition:color .18s,border-color .18s,background .18s}
#exitBtn:hover{color:#fff;border-color:rgba(255,138,42,.7);background:rgba(255,138,42,.18)}
/* ---- start screen ---- */
#startScr{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;box-sizing:border-box;
 background:radial-gradient(ellipse 70% 45% at 50% 28%,rgba(255,138,42,.28),transparent 70%),radial-gradient(ellipse 80% 50% at 50% 100%,rgba(70,110,200,.22),transparent 70%),linear-gradient(180deg,#0b101b,#080b13);
 opacity:1;transition:opacity .5s ease}
#startScr.out{opacity:0;pointer-events:none}
#startScr .ss-logo{font-size:3.6rem;filter:drop-shadow(0 8px 24px rgba(255,138,42,.45));animation:ssFloat 3.2s ease-in-out infinite}
#startScr h2{margin:0 0 6px;font-size:1.35rem;font-weight:800;letter-spacing:.04em;color:#fff;text-align:center}
#startScr .ss-btns{display:flex;flex-direction:column;gap:12px;width:min(100%,320px)}
#startScr button{position:relative;padding:17px 20px;border-radius:18px;font:inherit;font-size:1.05rem;font-weight:800;color:#fff;cursor:pointer;text-align:center;
 background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 28px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,138,42,.0);
 transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease}
#startScr button:hover{transform:translateY(-2px) scale(1.02);border-color:rgba(255,138,42,.7);background:linear-gradient(160deg,rgba(255,138,42,.28),rgba(255,138,42,.1));box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 3px rgba(255,138,42,.14)}
#startScr button:active{transform:scale(.98)}
#startScr .ss-main{padding:20px;font-size:1.2rem;border-color:rgba(255,138,42,.75);background:linear-gradient(160deg,#ff9a3c,#e8731a);box-shadow:0 14px 34px rgba(232,115,26,.38),inset 0 1px 0 rgba(255,255,255,.35)}
#startScr .ss-main:hover{background:linear-gradient(160deg,#ffac58,#f07d22);box-shadow:0 18px 40px rgba(232,115,26,.5),0 0 0 3px rgba(255,138,42,.22)}
#startScr button:disabled{opacity:.35;cursor:not-allowed;pointer-events:none;filter:saturate(.4);box-shadow:none;transform:none}
@keyframes ssFloat{50%{transform:translateY(-6px)}}
/* ---- size mismatch badge ---- */
#sizeWarn{position:absolute;right:22px;top:50%;transform:translateY(-50%);z-index:12;display:none;padding:3px 9px;border-radius:999px;font-size:.62rem;font-weight:800;letter-spacing:.02em;color:#2b1a00;background:#ffcf5a;box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:auto}
/* ---- order card ---- */
#ordSlot{flex:none;height:54px;padding:4px 12px 2px;position:relative;z-index:11;box-sizing:border-box;overflow:hidden}
#ordOv{position:absolute;inset:0;z-index:90;display:none;pointer-events:none}
#ordOv.on{display:block;pointer-events:auto}
#ordBd{position:absolute;inset:0;background:rgba(4,6,10,.72);opacity:0;transition:opacity .3s ease}
#ordOv.dim #ordBd{opacity:1}
#ordCard{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;border-radius:24px;overflow:hidden;
 background:linear-gradient(160deg,#2a3346,#1b2232);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,138,42,.22)}
#ordCard small{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mut,#94a3b8);font-weight:700}
#ordCard b{font-size:1.7rem;line-height:1.15;font-weight:800;color:var(--ink,#fff)}
#ordCard.go{transition:left .3s cubic-bezier(.65,0,.35,1),top .3s cubic-bezier(.65,0,.35,1),width .3s cubic-bezier(.65,0,.35,1),height .3s cubic-bezier(.65,0,.35,1),padding .3s,border-radius .3s,gap .3s,box-shadow .3s}
#ordCard.go small,#ordCard.go b{transition:font-size .3s cubic-bezier(.65,0,.35,1),letter-spacing .3s}
#ordCard.docked{padding:3px 10px;border-radius:14px;gap:1px;box-shadow:inset 0 0 0 1px rgba(255,138,42,.22)}
#ordCard.docked small{font-size:.56rem;letter-spacing:.14em}
#ordCard.docked b{font-size:.95rem}
#ordSlot #ordCard{position:static;width:100%;height:100%}
#modal{position:absolute;inset:0;z-index:80;background:rgba(4,6,10,.74);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#modal.show{opacity:1;pointer-events:auto;backdrop-filter:blur(4px)}
.pat{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:.85rem;padding:10px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}.pat:active{transform:scale(.95)}
.mknob{transform-origin:35px 12px;animation:mspin .3s linear infinite}@keyframes mspin{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.bsq{transform-box:fill-box;transform-origin:50% 100%;animation:sqz .55s ease-in-out infinite}@keyframes sqz{50%{transform:scale(.96,.99)}}
.mshake{transform-origin:35px 100px;animation:mshk .22s ease-in-out infinite alternate}@keyframes mshk{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
/* octagonal pizza box: the two bottom (front) corners are cut at 45 deg; the square parchment lives above the box shape, so its corners peek out of the cuts */
.bxo,.bxn{position:absolute;display:block}
.bxo{inset:0;background:linear-gradient(135deg,#b88650,#a97a42);clip-path:polygon(0 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)))}
.bxn{inset:7px;background:linear-gradient(135deg,#c9995d,#ad7d45);clip-path:polygon(0 0,100% 0,100% calc(100% - var(--c2)),calc(100% - var(--c2)) 100%,var(--c2) 100%,0 calc(100% - var(--c2)))}
.lid .bxo{background:#a37238}.lid .bxn{background:linear-gradient(135deg,#b88650,#9a6c38)}.lid span{position:relative}
#unit,#stage,#spoon,#modal,.fly,.bx,.lid{will-change:transform,opacity}
#unit,#spoon,#modal,.fly{transform:translateZ(0)}
</style>
</head>
<body>
<div id="app" class="relative mx-auto h-full max-w-[480px] overflow-hidden flex flex-col">
  <div id="oven"><div class="arch"></div>
    <div class="fl" style="left:4%"></div><div class="fl" style="left:18%;animation-delay:.15s"></div><div class="fl" style="left:33%;animation-delay:.3s"></div><div class="fl" style="left:41%;animation-delay:.1s"></div><div class="fl" style="left:56%;animation-delay:.25s"></div><div class="fl" style="left:70%;animation-delay:.05s"></div><div class="fl" style="left:80%;animation-delay:.2s"></div></div>
  <header class="relative z-10 flex items-start justify-between px-4 pt-3">
    <div><div class="text-[10px] uppercase tracking-[.2em] text-slate-400">Вага</div>
      <div class="text-[2.6rem] leading-none font-extrabold tabular-nums"><span id="wn">250</span><span class="text-lg font-semibold text-slate-400 ml-1">г</span></div>
      <div id="sub" class="text-xs text-slate-400 mt-1"></div><button id="undo" class="undo" type="button" title="Скасувати останню дію" aria-label="Скасувати останню дію" disabled>↶ Скасувати</button></div>
    <div id="sizeCol"><div id="sizes" class="flex gap-1.5"></div><button id="sndBtn" type="button" aria-label="Звук увімк./вимк." title="Звук">🔊</button></div>
  </header>
  <main id="arena" class="relative flex-1 min-h-0 flex items-center justify-center p-2">
    <div id="hint"></div>
    <button id="exitBtn" type="button" aria-label="Вийти в меню">← В меню</button>
    <div id="unit"><div class="bx" id="bx"><b class="bxo"></b><b class="bxn"></b><i></i></div>
    <div id="stage"><svg id="pzBase" viewBox="0 0 320 320" aria-hidden="true"><circle id="crust" cx="160" cy="160" r="150"/><circle id="dough" cx="160" cy="160" r="136"/><circle id="bakeR" cx="160" cy="160" r="150" fill="url(#bk)"/>
      <g id="gSauce"><circle id="sFill" cx="160" cy="160" r="131"/><path id="sPath" fill="none" stroke-width="13" stroke-linecap="round"/></g></svg>
    <svg id="pz" viewBox="0 0 320 320">
      <defs><radialGradient id="gl" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff3b8"/><stop offset=".45" stop-color="#f6cf5e"/><stop offset="1" stop-color="#e2a52f"/></radialGradient>
      <radialGradient id="bk" cx="50%" cy="50%" r="50%"><stop offset=".72" stop-color="#c98b2c" stop-opacity="0"/><stop offset="1" stop-color="#b8791f" stop-opacity=".42"/></radialGradient><filter id="bump" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7" result="n"/><feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="4.5" result="l"><feDistantLight azimuth="225" elevation="52"/></feDiffuseLighting><feComposite in="l" in2="SourceAlpha" operator="in"/></filter>
      <filter id="soft"><feGaussianBlur stdDeviation=".45"/></filter><filter id="soft1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".9"/></filter><filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter><filter id="soft4" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3.2"/></filter>
      <radialGradient id="bub" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff7d2"/><stop offset=".6" stop-color="#f7d97c"/><stop offset="1" stop-color="#e2ae4a"/></radialGradient>
      <radialGradient id="btint"><stop offset="0" stop-color="#7f9bbb" stop-opacity=".38"/><stop offset="1" stop-color="#7f9bbb" stop-opacity="0"/></radialGradient>
      <clipPath id="mclip"><circle id="mclipC" cx="160" cy="160" r="125"/></clipPath><radialGradient id="gold"><stop offset="0" stop-color="#dca33b" stop-opacity=".6"/><stop offset="1" stop-color="#dca33b" stop-opacity="0"/></radialGradient><mask id="cmask" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="320"><rect width="320" height="320" fill="#fff"/><g id="cmaskHoles" fill="#000" filter="url(#soft)"></g></mask><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fa"/><stop offset=".5" stop-color="#b9c2ce"/><stop offset="1" stop-color="#8d98a7"/></linearGradient><clipPath id="mcut"></clipPath><radialGradient id="gold2"><stop offset="0" stop-color="#b8701c" stop-opacity=".8"/><stop offset=".55" stop-color="#c98a2a" stop-opacity=".38"/><stop offset="1" stop-color="#c98a2a" stop-opacity="0"/></radialGradient><radialGradient id="edgeDark"><stop offset="0" stop-color="#7a3e14" stop-opacity=".10"/><stop offset=".6" stop-color="#5a2a0e" stop-opacity=".14"/><stop offset="1" stop-color="#37140a" stop-opacity=".62"/></radialGradient></defs>
      
      <g id="gShade"></g><g id="gIng"></g><circle id="roast" cx="160" cy="160" r="120" fill="#a8651c" style="opacity:0;transition:opacity 2.4s ease-in-out"/><g id="meltW"><circle id="melt" cx="160" cy="160" r="0"/><g id="cheeseB" style="opacity:0"></g></g><g id="meltDeco" clip-path="url(#mcut)" style="opacity:0;transition:opacity 3s"></g><g id="gMold" clip-path="url(#mcut)"></g><g id="toastG" clip-path="url(#mcut)"></g><g id="gCut"></g><g id="gPost"></g>
      <g id="gKnife" style="opacity:0"></g>
    </svg><svg id="pzFx" viewBox="0 0 320 320" aria-hidden="true"><g id="fxCut"></g><g id="fxPost"></g><g id="fxKnife" style="opacity:0"></g></svg></div>
    <div class="lid" id="lid"><b class="bxo"></b><b class="bxn"></b><span>СМАЧНОГО</span></div></div>
  </main>
  <div id="ordSlot"><span id="sizeWarn"></span></div>
  <section id="panel" class="relative z-10 h-[232px] shrink-0 px-3 pt-3 pb-3 rounded-t-3xl border-t border-white/10 bg-white/[.06]"></section>
  <div id="modal"><div class="text-lg font-extrabold">Оберіть візерунок соусу</div><div class="flex gap-4">

  ${D.layers?`<div class="text-xs ${D.layers.ok?'text-emerald-300':'text-red-300'}">Шари: ${D.layers.need.map(id=>ING.find(i=>i.id===id).n).join(' → ')} — ${D.layers.ok?'✓ дотримано':'✗ порушено (у вас: '+(D.layers.seq.map(id=>ING.find(i=>i.id===id)?.n||id).join(' → ')||'—')+')'}</div>`:''}
  ${D.extra.length?`<div class="text-xs text-red-300">Додатково, не за ТК: ${D.extra.join('; ')}</div>`:''}`;
}
function report(){
 hideOrder();sfxDone();const d=$('#done'),z=SIZES[S.size],ings=ING.filter(i=>S.qty[i.id]).map(i=>`${i.n} — ${S.qty[i.id]} г`),ps=[...POST.filter(p=>S.post[p.id]).map(p=>p.n),...S.drizzles.map(d=>`${TOPS.find(t=>t.id===d.id).n} (${d.pat==='wave'?'хвиляста лінія':'спіральна лінія'})`)],e=allErrors();
 d.style.display='flex';
 d.innerHTML=`<div class="text-5xl">✔</div><div class="text-2xl font-extrabold mt-2" style="color:var(--ok)">Замовлення виконано!</div>
 <div class="mt-4 w-full max-w-[340px] text-left text-sm rounded-2xl bg-white/[.07] border border-white/10 p-4 space-y-1.5">
  <div><b>Піца ${z.cm} см</b> · ${hasMeat()?'з м\'ясом':'вегетаріанська'} · <b>${total()} г</b> (після ужарки −${raw()-baked()} г)</div>
  <div class="text-slate-300">${SAUCES[S.sauce].n}${ings.length?'; '+ings.join('; '):''}</div>
  ${ps.length?`<div class="text-slate-300">Після випікання: ${ps.join(', ')}</div>`:''}
  <div>Ніж: <b>${S.knife==='white'?'білий':'чорний'}</b></div>
  ${devHTML()}
  <div class="pt-2 border-t border-white/10 font-bold ${e.length?'text-red-300':'text-emerald-300'}">${e.length?`Помилок відповідності: ${e.length}`:'Помилок відповідності немає'}</div>
  ${e.map(x=>`<div class="text-xs text-red-300">• ${x}</div>`).join('')}</div>
 <button class="ready mt-5" onclick="nextOrder()">Нове замовлення</button>`;
 for(let i=0;i<30;i++){const s=document.createElement('div'),a=Math.random()*6.28,r=90+Math.random()*150;s.className='spark';s.style.cssText=`left:50%;top:30%;background:hsl(${Math.random()*360} 90% 60%);--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px;animation-delay:${Math.random()*.4}s`;d.appendChild(s)}
}
/* ---- order system ---- */
const ORDER_CATALOG=[   /* extendable: push {kind:'Кальцоне',names:['…'],sizes:()=>[25,30]} */
 {kind:'Піца',names:['Маргарита','Пепероні','Бір Бургер'],sizes:()=>Object.values(SIZES).map(s=>s.cm)}
];
let ORDER=null;
const pickOne=a=>a[Math.random()*a.length|0],orderText=o=>`${o.kind} "${o.name}" ${o.size} см`;
function genOrder(){const p=pickOne(ORDER_CATALOG);return{kind:p.kind,name:pickOne(p.names),size:pickOne(p.sizes())}}
/* fade the docked order banner out while the pizza is boxed and delivered; showOrder() brings it back for the next order */
function hideOrder(){
 $('#sizeWarn').style.display='none';
 const c=$('#ordCard');if(!c||c.parentNode.id!=='ordSlot'||c.dataset.gone)return;c.dataset.gone=1;
 c.style.transition='opacity .45s ease,transform .45s ease';c.style.opacity=0;c.style.transform='scale(.9)';
 setTimeout(()=>{c.style.display='none'},470);
}
/* ---- size validation: non-blocking badge + toast, mismatch kept in session state, listed in the final report ---- */
const sizeErrText=()=>{if(!ORDER)return'';const made=SIZES[S.size].cm;return made===ORDER.size?'':`Невідповідність розміру: замовлено ${ORDER.size} см, зроблено ${made} см`};
const allErrors=()=>{const x=sizeErrText();return[...S.errors,...(x?[x]:[]),...patErrs()]};
function checkSize(notify){
 const w=$('#sizeWarn'),made=SIZES[S.size].cm,mis=!!ORDER&&made!==ORDER.size;
 S.sizeMismatch=mis?{ordered:ORDER.size,made}:null;
 w.style.display=mis?'block':'none';w.textContent=mis?`⚠ ${made} см`:'';w.title=sizeErrText();
 if(mis&&notify)toast(`Розмір не збігається: замовлено ${ORDER.size} см, обрано ${made} см`);
}
async function showOrder(){
 if(showOrder.busy)return;showOrder.busy=1;
 const app=$('#app'),ov=$('#ordOv'),card=$('#ordCard'),slot=$('#ordSlot');
 ORDER=genOrder();card.querySelector('b').textContent=orderText(ORDER);
 delete card.dataset.gone;card.className='';card.style.cssText='opacity:0;transform:scale(.5)';ov.appendChild(card);ov.style.display='';ov.classList.add('on');
 const A=app.getBoundingClientRect(),w=Math.min(A.width*.8,340),h=A.height*.25;      /* centered card, ~25% of the screen */
 Object.assign(card.style,{left:(A.width-w)/2+'px',top:(A.height-h)/2+'px',width:w+'px',height:h+'px'});
 ov.classList.remove('dim');ov.getBoundingClientRect();ov.classList.add('dim');
 sfxOrder();
 await card.animate([{opacity:0,transform:'scale(.5)'},{opacity:1,transform:'scale(1)'}],{duration:300,easing:'cubic-bezier(.2,.9,.3,1)',fill:'both'}).finished;   /* entrance: 0.4 s, fade in + scale .75 -> 1 */
 card.style.opacity='';card.style.transform='';
 await wait(300);                                                                      /* 1.5 s with the dark backdrop */
 const Sr=slot.getBoundingClientRect();
 card.classList.add('go','docked');                                                     /* glide down into the gap above the ingredient panel + shrink */
 Object.assign(card.style,{left:Sr.left-A.left+12+'px',top:Sr.top-A.top+4+'px',width:Sr.width-24+'px',height:Sr.height-6+'px'});
 ov.classList.remove('dim');                                                            /* backdrop fades out */
 await wait(350);
 $('#ordBd').style.opacity=0;ov.style.display='none';
 card.getAnimations().forEach(a=>a.cancel());card.classList.remove('go');card.style.cssText='';slot.appendChild(card);ov.classList.remove('on');checkSize(true);
 showOrder.busy=0;
}
/* ---- Web Audio SFX (no files): context is created on the first user gesture; mute state is remembered ---- */
let AC=null,SFX_MUTED=(()=>{try{return localStorage.getItem('pzMute')==='1'}catch(e){return false}})();
const sfxInit=()=>{
 if(AC){AC.state==='suspended'&&AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});                  /* lowest output latency */
  const g=AC.createGain(),lp=AC.createBiquadFilter();g.gain.value=.5;lp.type='lowpass';lp.frequency.value=3000;lp.Q.value=.4;   /* master low-pass: takes the edge off every sound */
  g.connect(lp);lp.connect(AC.destination);AC.master=g;
  const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,AC.sampleRate);s.connect(AC.destination);s.start()}      /* warm-up so the very first sound has no lag */
 catch(e){AC=null}
};
function tone(f,at,dur,vol,type='sine',f2,atk=.012){
 if(!AC||SFX_MUTED)return;const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);f2&&o.frequency.exponentialRampToValueAtTime(f2,t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(AC.master);o.start(t);o.stop(t+dur+.02);
}
function noise(at,dur,vol,f1,f2,q=1.2,atk=.012){                         /* band-passed noise burst, centre frequency sweeps f1 -> f2 */
 if(!AC||SFX_MUTED)return;const t=AC.currentTime+at;
 if(!AC.nb){const n=AC.sampleRate*.8|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AC.nb=b}
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=AC.nb;f.type='bandpass';f.Q.value=q;
 f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atk);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(AC.master);s.start(t,Math.random()*.3);s.stop(t+dur+.02);
}
/* core events (smooth sine chimes, lower register, slower attack, no bright overtones) */
const sfxOrder=()=>{tone(523,0,.8,.085,'sine',null,.02);tone(262,0,.8,.04,'sine',null,.02);tone(659,.14,1,.085,'sine',null,.02)};
const sfxDone=()=>{[392,494,587].forEach((f,i)=>tone(f,i*.11,.6,.08,'sine',null,.02));tone(784,.33,1.1,.085,'sine',null,.02);tone(392,.33,1.1,.04,'sine',null,.02)};
/* process sounds */
let _tl=0;
function playToppingSound(){const n=performance.now();if(n-_tl<70)return;_tl=n;const f=260+Math.random()*60;tone(f,0,.09,.05,'sine',f*.6,.004)}   /* instant, warm, soft tap */
function playFlameSound(){                                               /* soft cozy flame: low swell + warm hiss + a few tiny crackles */
 noise(0,.75,.045,300,180,.7,.18);noise(.05,.6,.02,900,500,.6,.2);
 for(let i=0;i<7;i++)noise(.04+Math.random()*.6,.025+Math.random()*.03,.016+Math.random()*.02,1100+Math.random()*1300,600,2.2,.004);
}
function playSliceSound(){noise(0,.16,.06,2200,800,.9,.02);tone(120,.04,.07,.04,'sine',65)}                  /* soft swish + dull crunch */
const sndBtn=$('#sndBtn'),sndIcon=()=>{sndBtn.textContent=SFX_MUTED?'🔇':'🔊'};sndIcon();
sndBtn.addEventListener('click',()=>{SFX_MUTED=!SFX_MUTED;try{localStorage.setItem('pzMute',SFX_MUTED?'1':'0')}catch(e){}sndIcon()});
document.addEventListener('pointerdown',sfxInit,{passive:true});
/* ---- start screen / training flow ---- */
const ACTIVE_MODES=['pizza'];   /* add ids here (and remove `disabled` on their buttons) to unlock a mode */
let currentGameMode=null;   /* 'pizza' | 'custom' | 'all' - pick per-mode catalogs inside genOrder() when they exist */
const modeStore={get:()=>{try{return sessionStorage.getItem('pzMode')}catch(e){return null}},set:m=>{try{m?sessionStorage.setItem('pzMode',m):sessionStorage.removeItem('pzMode')}catch(e){}}};
function restartSession(mode){                      /* fade out -> reset the whole session (reload) -> mode is restored on load */
 modeStore.set(mode);document.body.style.transition='opacity .35s ease';document.body.style.opacity=0;
 setTimeout(()=>location.reload(),370);
}
const nextOrder=()=>restartSession(currentGameMode);   /* "Нове замовлення" after a finished pizza: same mode, new order modal */
const exitToMenu=()=>restartSession(null);              /* "В меню": back to the start screen */
function startGame(m){
 if(currentGameMode||!ACTIVE_MODES.includes(m))return;currentGameMode=m;modeStore.set(m);const sc=$('#startScr');sc.classList.add('out');
 setTimeout(()=>{sc.style.display='none';showOrder()},520);
}
document.querySelectorAll('#startScr [data-mode]').forEach(b=>b.addEventListener('click',()=>startGame(b.dataset.mode)));
$('#exitBtn').addEventListener('click',exitToMenu);
refresh();panel();
if(ACTIVE_MODES.includes(modeStore.get())){currentGameMode=modeStore.get();showOrder()}   /* training continues in the selected mode: new order right after the reload */
</script>
